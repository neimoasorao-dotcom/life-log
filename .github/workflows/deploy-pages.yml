name: Deploy life log to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Test the production build in Chromium and WebKit
        run: npm run test:pages
      - name: Build for the project site
        run: npm run build
        env:
          VITE_BASE_PATH: /life-log/
      - name: Write deployment revision
        run: node -e 'require("fs").writeFileSync("dist/version.json", JSON.stringify({revision:process.env.GITHUB_SHA}))'
      - name: Use a single Pages publishing source
        uses: actions/github-script@v7
        with:
          script: |
            const repository = context.repo;
            const { data: site } = await github.rest.repos.getPages(repository);
            core.info(`Current Pages build type: ${site.build_type}`);
            if (site.build_type !== 'workflow') {
              try {
                await github.rest.repos.updateInformationAboutPagesSite({
                  ...repository,
                  build_type: 'workflow',
                });
              } catch (error) {
                core.setFailed('Switch Settings → Pages → Source to GitHub Actions, then rerun this workflow. The old branch publishing source can overwrite the built application.');
                return;
              }
            }
            const { data: configured } = await github.rest.repos.getPages(repository);
            if (configured.build_type !== 'workflow') {
              core.setFailed('Pages must use GitHub Actions as its only publishing source.');
            }
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the built application
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Verify the published app in Chromium and WebKit
        run: npx playwright test --config=playwright.live.config.ts
        env:
          EXPECTED_BUILD_SHA: ${{ github.sha }}
      - name: Save published-site test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-site-test-results
          path: test-results/
